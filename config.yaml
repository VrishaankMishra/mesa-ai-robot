# MeSA 2.0 configuration — all tunable thresholds live here (ticket INFRA-003).
# Values are placeholders for Phase 0; tune them as each subsystem lands.

vision:
  camera_index: 0
  frame_width: 640
  frame_height: 480
  detection_every_n_frames: 3   # run YOLO on every Nth frame; pose runs every frame

detection:
  model_path: models/best.pt
  confidence_threshold: 0.5     # below this, a bottle is flagged "unknown / wrong medication"

pose:
  min_fps: 5
  lying_trigger_seconds: 30     # lying longer than this fires a possible_fall event
  smoothing_window: 9           # frames of majority-vote smoothing to de-flicker posture labels

compliance:
  absence_debounce_seconds: 3   # ignore brief occlusions (a hand passing over a bottle)
  taken_after_absent_seconds: 10  # absent >= this, then returned => "taken" event

escalation:
  l1_wait_seconds: 60           # no response to spoken check-in => escalate to L2 (ntfy)
  inactivity_window_seconds: 3600  # no person/motion for this long => escalation L1

voice:
  wake_word: mesa
  stt_engine: vosk              # swappable: "vosk" | "whisper-tiny"
  vosk_model_path: models/vosk-model-small-en-us

alerts:
  ntfy_topic: mesa-alerts-CHANGEME   # set to a private ntfy.sh topic
  twilio_enabled: false

# Hardware outputs — OLED face + pan/tilt head (HW-005/006).
# enabled=false uses Null drivers so laptop dev/tests run with no hardware; the Pi service
# sets enabled=true. The factories fall back to Null if the libraries/bus aren't present,
# so true is always safe to try. See mesa/hardware/.
hardware:
  enabled: false
  pan_channel: 0
  tilt_channel: 1
  track_gain: 40.0      # proportional gain: normalized error -> degrees
  track_deadzone: 0.05  # ignore errors smaller than this (anti-jitter)
  track_max_step: 4.0   # max degrees moved per update (anti-oscillation)
  invert_pan: false
  invert_tilt: false

# Research extension — pre-event feature capture (DATA-001/RES-001).
# Off by default so the build/demos carry zero overhead. See docs/research-dataset-design.md.
research:
  enabled: false              # master switch; when off, no capture layer runs
  clips_dir: data/clips       # where .npz clips are written (git-ignored)
  buffer_seconds: 6           # ring-buffer length; >= max sweep window so N is chosen offline
  max_bottles: 5              # K: object-array slots per frame
  capture_hands: false        # RES-002 toggle; records FPS impact when on
  persist_video: false        # debug only, consented Tier-1; never released
  negative_guard_factor: 2    # clean-negative guard band = factor x N

# Medication schedule — populated in Week 3 (ENG-001).
schedule:
  medications: []
