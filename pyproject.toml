[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mesa-ai-robot"
version = "0.1.0"
description = "MeSA 2.0 — Medication & Safety Assistant Robot (assistive aid, not a medical device)"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["mesa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
